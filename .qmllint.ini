[General]
MaxWarnings=0

[Warnings]
# Quickshell's runtime QProcess enum is absent from its static qmltypes data.
BadSignalHandlerParameters=disable
# Omarchy theme maps are dynamic QObject values and cannot be typed statically.
MissingProperty=disable
# PanelWindow is created by Quickshell even though Qt marks its base uncreatable.
UncreatableType=disable
# The native picker intentionally reaches outer IDs from Repeater delegates.
UnqualifiedAccess=disable
